# Pushes new migrations to Supabase when they land on a deploy branch:
#   development -> dev project  (GitHub environment "development", no approval)
#   main        -> prod project (GitHub environment "production", requires approval)
# Each environment holds its own secrets and only allows its own branch.
name: DB deploy

on:
  push:
    branches: [main, development]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

# Never run two migrations against the same project at once, and never cancel one halfway.
concurrency:
  group: db-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/db-test.yml

  deploy:
    name: Push migrations (${{ github.ref_name == 'main' && 'prod' || 'dev' }})
    needs: test
    if: github.ref_name == 'main' || github.ref_name == 'development'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      # Session pooler URL (IPv4; GitHub runners have no IPv6, and the direct DB host is IPv6-only):
      # postgresql://postgres.<ref>:<url-encoded password>@aws-0-<region>.pooler.supabase.com:5432/postgres
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # Hard-coded so CI can never target the wrong project: main -> prod, development -> dev.
      SUPABASE_PROJECT_ID: ${{ github.ref_name == 'main' && 'isaihhepofinlygzhzaw' || 'zuvsgspwhhirrfmhociv' }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Check DB URL targets the expected project
        run: |
          if [[ "$SUPABASE_DB_URL" != "postgresql://postgres.$SUPABASE_PROJECT_ID:"* ]]; then
            echo "::error::SUPABASE_DB_URL is missing or does not point at project $SUPABASE_PROJECT_ID"
            exit 1
          fi

      - name: Show pending migrations
        run: supabase db push --dry-run --db-url "$SUPABASE_DB_URL"

      - name: Push migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
