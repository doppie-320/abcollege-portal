<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#132a4d" />
    <title>Offline — SOE Hub</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #ede7d9;
        color: #1c2333;
        font-family: Inter, system-ui, sans-serif;
        text-align: center;
      }
      main { max-width: 340px; }
      p.eyebrow { font-size: 12px; letter-spacing: 0.12em; color: #d9531e; margin: 0 0 8px; }
      h1 { font-size: 26px; color: #132a4d; margin: 0 0 12px; }
      p { line-height: 1.55; color: #4b5468; margin: 0 0 24px; }
      button {
        font: inherit;
        font-weight: 600;
        padding: 10px 22px;
        border: 0;
        border-radius: 8px;
        background: #132a4d;
        color: #fbfaf6;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">SOE HUB / OFFLINE</p>
      <h1>You're offline</h1>
      <p>Your pass and the scanner need a connection. Connect to Wi-Fi or mobile data, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
